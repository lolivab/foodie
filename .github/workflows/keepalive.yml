name: Mantener Supabase activo
on:
  schedule:
    - cron: '0 13 * * *'   # diario 13:00 UTC
    - cron: '0 1 * * *'    # y también 01:00 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Escribir en la base de datos
        run: |
          curl -fsS --retry 5 --retry-delay 20 --retry-all-errors \
            -X POST "https://wsuqfcvijysvlugrqwug.supabase.co/rest/v1/keepalive?on_conflict=id" \
            -H "apikey: sb_publishable_quxHZEvhvS7YdpXdFQkFFQ_2GHIiDny" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            -d "{\"id\":1,\"pinged_at\":\"$(date -u +%FT%TZ)\"}"
