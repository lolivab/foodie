<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nuestros Restaurantes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2b2622;--mut:#8a8178;--ac:#c8553d;--ln:#e8e2d9;--gold:#e5a50a}
@media(prefers-color-scheme:dark){:root{--bg:#1c1917;--card:#292524;--tx:#f5f0ea;--mut:#a39a90;--ln:#3d3835}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:820px;margin:0 auto;padding:16px}
h1{margin:8px 0 14px;font-size:1.6rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:8px 10px}
button{cursor:pointer}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.tabs button{flex:1;font-weight:600}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grow{flex:1;min-width:140px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:10px}
.card h3{margin:0 0 2px;font-size:1.1rem}
.mut{color:var(--mut);font-size:.85rem}
.row{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;align-items:center}
.stars{display:inline-flex;gap:1px;font-size:1.3rem;line-height:1}
.stars span{color:var(--ln)}
.stars.me span{cursor:pointer}
.stars span.f{color:var(--gold)}
.who{display:flex;flex-direction:column;gap:2px;font-size:.8rem;color:var(--mut)}
.g{font-weight:700;color:var(--tx)}
.acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.acts button{padding:5px 9px;font-size:.8rem}
dialog{border:1px solid var(--ln);border-radius:12px;background:var(--card);color:var(--tx);width:min(94vw,440px)}
dialog::backdrop{background:#0006}
dialog label,.login label{display:block;margin:8px 0 3px;font-size:.85rem;color:var(--mut)}
dialog input,dialog select,dialog textarea,.login input{width:100%}
.empty{text-align:center;color:var(--mut);padding:30px}
.login{max-width:340px;margin:60px auto}
.err{color:#d33;font-size:.85rem;margin-top:8px}
[hidden]{display:none!important}
#pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:10px 0;max-height:60vh;overflow:auto}
#pgrid img{width:100%;border-radius:8px;display:block}
#pgrid figure{margin:0}#pgrid figcaption{font-size:.7rem}
#pdlg{width:min(96vw,760px)}
</style>
</head>
<body>
<main>

<!-- Pantalla de configuración faltante -->
<div id="noconf" class="empty" hidden>Falta configurar SUPABASE_URL y SUPABASE_KEY en index.html</div>

<!-- Login -->
<form id="login" class="login" hidden>
  <h1>🍽️ Nuestros Restaurantes</h1>
  <label>Correo</label><input name="email" type="email" required autocomplete="email">
  <label>Contraseña</label><input name="pw" type="password" required autocomplete="current-password">
  <div class="bar" style="margin-top:14px"><button class="pri grow">Entrar</button></div>
  <div class="err" id="lerr"></div>
</form>

<!-- App -->
<div id="app" hidden>
<h1>🍽️ Nuestros Restaurantes</h1>
<div class="bar tabs">
  <button id="t-v" class="on">✅ Visitados <span id="c-v"></span></button>
  <button id="t-p">📌 Por visitar <span id="c-p"></span></button>
</div>
<div class="bar">
  <input id="q" class="grow" placeholder="Buscar nombre, zona, cocina…">
  <select id="sort">
    <option value="avg">Mejor nuestra nota</option>
    <option value="g">Mejor nota Google</option>
    <option value="new">Más recientes</option>
    <option value="az">A–Z</option>
  </select>
  <button class="pri" id="add">+ Agregar</button>
</div>
<div id="list"></div>
<div class="bar" style="margin-top:20px">
  <button id="myname">✏️ Mi nombre</button>
  <button id="gupd">🔄 Actualizar notas de Google</button>
  <button id="impcsv">⬆ Importar lista de Google (CSV)</button><input type="file" id="csvfile" accept=".csv" hidden>
  <button id="logout">Salir</button>
</div>
</div>
</main>

<dialog id="dlg">
  <form method="dialog" id="f">
    <h3 id="dt">Agregar restaurante</h3>
    <label>Nombre *</label><input name="name" required>
    <label>Zona / ciudad</label><input name="zone">
    <label>Tipo de cocina</label><input name="cuisine">
    <label>Link de Google Maps</label><input name="url" type="url" placeholder="https://maps.app.goo.gl/…">
    <label>Nota en Google Maps (0–5)</label><input name="g" type="number" min="0" max="5" step="0.1">
    <label>Estado</label>
    <select name="status"><option value="p">Por visitar</option><option value="v">Visitado</option></select>
    <label>Notas</label><textarea name="notes" rows="2"></textarea>
    <div class="bar" style="margin-top:12px;justify-content:flex-end">
      <button type="button" id="cancel">Cancelar</button>
      <button class="pri" value="ok">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="pdlg">
  <h3 id="ptitle"></h3>
  <div id="pgrid"></div>
  <div class="bar" style="justify-content:space-between;margin:0">
    <a id="pmaps" href="#" target="_blank" rel="noopener">Ver en Google Maps ↗</a>
    <button type="button" onclick="document.querySelector('#pdlg').close()">Cerrar</button>
  </div>
</dialog>

<script>
// ====== CONFIGURACIÓN (Supabase > Project Settings > API) ======
const SUPABASE_URL = 'https://wsuqfcvijysvlugrqwug.supabase.co';
const GOOGLE_KEY = 'PEGA_AQUI_TU_GOOGLE_KEY'; // Google Cloud > Places API (New)
const SUPABASE_KEY = 'sb_publishable_quxHZEvhvS7YdpXdFQkFFQ_2GHIiDny';
// ================================================================

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gEnabled = !GOOGLE_KEY.startsWith('PEGA');
let sb, me = null, lastId = undefined, R = [], RT = [], P = [], tab = 'v', editId = null, chan = null;

if (SUPABASE_URL.startsWith('PEGA')) { $('#noconf').hidden = false; }
else {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  sb.auth.onAuthStateChange((_e, session) => setSession(session));
  sb.auth.getSession().then(({data}) => setSession(data.session));
}

async function setSession(session) {
  const u = session?.user || null;
  const id = u?.id || null;
  if (id === lastId) return;
  lastId = id;
  me = u;
  $('#login').hidden = !!me;
  $('#app').hidden = !me;
  if (chan) { sb.removeChannel(chan); chan = null; }
  if (!me) return;
  await refresh();
  if (!P.find(p => p.id === me.id)) await askName();
  chan = sb.channel('cambios')
    .on('postgres_changes', {event: '*', schema: 'public', table: 'restaurants'}, refresh)
    .on('postgres_changes', {event: '*', schema: 'public', table: 'ratings'}, refresh)
    .subscribe();
}

async function refresh() {
  const [a, b, c] = await Promise.all([
    sb.from('restaurants').select('*'),
    sb.from('ratings').select('*'),
    sb.from('profiles').select('*')
  ]);
  R = a.data || []; RT = b.data || []; P = c.data || [];
  render();
}

async function askName() {
  const cur = P.find(p => p.id === me.id)?.name || '';
  const n = prompt('¿Cómo te llamas? (se muestra junto a tus estrellas)', cur);
  if (!n || !n.trim()) return;
  await sb.from('profiles').upsert({id: me.id, name: n.trim()});
  await refresh();
}

$('#login').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target.elements;
  const {error} = await sb.auth.signInWithPassword({email: f.email.value.trim(), password: f.pw.value});
  $('#lerr').textContent = error ? 'Correo o contraseña incorrectos' : '';
});
$('#logout').onclick = () => sb.auth.signOut();
$('#myname').onclick = askName;

const ratingsOf = id => RT.filter(r => r.restaurant_id === id);
const avg = id => { const a = ratingsOf(id); return a.length ? a.reduce((s, r) => s + r.stars, 0) / a.length : 0; };
const nameOf = uid => P.find(p => p.id === uid)?.name || 'Sin nombre';

function stars(v, rid, mine) {
  let h = `<span class="stars ${mine ? 'me' : ''}">`;
  for (let i = 1; i <= 5; i++) h += `<span class="${i <= v ? 'f' : ''}" ${mine ? `data-rid="${rid}" data-v="${i}"` : ''}>★</span>`;
  return h + '</span>';
}

function render() {
  if (!me) return;
  $('#c-v').textContent = '(' + R.filter(i => i.status === 'v').length + ')';
  $('#c-p').textContent = '(' + R.filter(i => i.status === 'p').length + ')';
  $('#t-v').classList.toggle('on', tab === 'v'); $('#t-p').classList.toggle('on', tab === 'p');
  const q = $('#q').value.toLowerCase(), so = $('#sort').value;
  const l = R.filter(i => i.status === tab && [i.name, i.zone, i.cuisine, i.notes].join(' ').toLowerCase().includes(q));
  l.sort((a, b) => so === 'avg' ? avg(b.id) - avg(a.id) : so === 'g' ? (b.g || 0) - (a.g || 0) : so === 'az' ? a.name.localeCompare(b.name) : b.created_at.localeCompare(a.created_at));
  // siempre mostrar a los dos (o los que existan), yo primero
  const people = [...P].sort((a, b) => (b.id === me.id) - (a.id === me.id));
  if (!people.find(p => p.id === me.id)) people.unshift({id: me.id, name: 'Yo'});
  $('#list').innerHTML = l.length ? l.map(i => {
    const rs = ratingsOf(i.id), a = avg(i.id);
    return `
  <div class="card">
    <h3>${i.url ? `<a href="${esc(i.url)}" target="_blank" rel="noopener" style="color:inherit">${esc(i.name)}</a>` : esc(i.name)}</h3>
    <div class="mut">${[i.zone, i.cuisine].filter(Boolean).map(esc).join(' · ')}</div>
    ${i.notes ? `<div class="mut" style="margin-top:6px">${esc(i.notes)}</div>` : ''}
    <div class="row">
      <div class="who">Google<span class="g">${i.g ? '⭐ ' + Number(i.g).toFixed(1) + (i.g_count ? ' (' + i.g_count.toLocaleString('es') + ')' : '') : '—'}</span></div>
      ${i.status === 'v' ? people.map(p => `<div class="who">${esc(p.name)}${stars(rs.find(r => r.user_id === p.id)?.stars || 0, i.id, p.id === me.id)}</div>`).join('') +
        `<div class="who">Promedio<span class="g">${a ? a.toFixed(1) : '—'}</span></div>` : ''}
      <div class="acts">
        ${i.status === 'p' ? `<button data-a="visit" data-id="${i.id}">Ya fuimos</button>` : ''}
        <button data-a="photos" data-id="${i.id}">📷 Fotos</button>
        <button data-a="edit" data-id="${i.id}">Editar</button>
        <button data-a="del" data-id="${i.id}">Borrar</button>
      </div>
    </div>
  </div>`;
  }).join('') : '<div class="empty">Nada por aquí todavía.</div>';
}

document.addEventListener('click', async e => {
  const t = e.target, id = t.dataset.id;
  if (t.dataset.rid) {
    const rid = t.dataset.rid, v = +t.dataset.v;
    const cur = RT.find(r => r.restaurant_id === rid && r.user_id === me.id)?.stars;
    if (cur === v) await sb.from('ratings').delete().eq('restaurant_id', rid).eq('user_id', me.id);
    else await sb.from('ratings').upsert({restaurant_id: rid, user_id: me.id, stars: v});
    return refresh();
  }
  if (t.dataset.a === 'del' && confirm('¿Borrar?')) { await sb.from('restaurants').delete().eq('id', id); refresh(); }
  if (t.dataset.a === 'visit') { await sb.from('restaurants').update({status: 'v'}).eq('id', id); refresh(); }
  if (t.dataset.a === 'edit') openDlg(id);
  if (t.dataset.a === 'photos') showPhotos(id);
});

function openDlg(id) {
  editId = id || null; const f = $('#f'); f.reset();
  $('#dt').textContent = id ? 'Editar restaurante' : 'Agregar restaurante';
  const it = id ? R.find(i => i.id === id) : {status: tab};
  for (const k of ['name', 'zone', 'cuisine', 'url', 'g', 'status', 'notes']) f.elements[k].value = it[k] ?? '';
  $('#dlg').showModal();
}
$('#add').onclick = () => openDlg();
$('#cancel').onclick = () => $('#dlg').close();
$('#f').addEventListener('submit', async () => {
  const f = $('#f').elements, d = {};
  for (const k of ['name', 'zone', 'cuisine', 'url', 'notes', 'status']) d[k] = f[k].value.trim() || (k === 'status' ? 'p' : null);
  d.g = f.g.value ? Math.min(5, Math.max(0, +f.g.value)) : null;
  if (!d.name) return;
  if (editId) await sb.from('restaurants').update(d).eq('id', editId);
  else await sb.from('restaurants').insert(d);
  refresh();
});
$('#t-v').onclick = () => { tab = 'v'; render(); };
$('#t-p').onclick = () => { tab = 'p'; render(); };
$('#q').oninput = render; $('#sort').onchange = render;

function parseCSV(t){const rows=[];let r=[],c='',q=false;t=t.replace(/^﻿/,'');
for(let i=0;i<t.length;i++){const ch=t[i];
 if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
 else if(ch==='"')q=true;
 else if(ch===','){r.push(c);c=''}
 else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';rows.push(r);r=[]}
 else c+=ch}
if(c||r.length){r.push(c);rows.push(r)}return rows}
$('#impcsv').onclick=()=>$('#csvfile').click();
$('#csvfile').onchange=async e=>{
 const fl=e.target.files[0];e.target.value='';if(!fl)return;
 const rows=parseCSV(await fl.text());
 const h=rows[0].map(x=>x.trim().toLowerCase());
 const ix=(...n)=>h.findIndex(x=>n.includes(x));
 const iT=ix('título','titulo','title'),iN=ix('nota','note'),iU=ix('url'),iC=ix('comentario','comment');
 if(iT<0||iU<0){alert('No reconozco el formato del CSV');return}
 const have=new Set(R.map(r=>r.url).filter(Boolean));
 const items=[];
 for(const r of rows.slice(1)){const name=(r[iT]||'').trim(),url=(r[iU]||'').trim();
  if(!name||(url&&have.has(url)))continue;if(url)have.add(url);
  items.push({name,url:url||null,notes:[r[iN],iC>=0?r[iC]:''].map(x=>(x||'').trim()).filter(Boolean).join(' · ')||null,status:'p'})}
 if(!items.length){alert('No hay lugares nuevos para importar');return}
 if(!confirm('¿Importar '+items.length+' lugares como "Por visitar"?'))return;
 const {error}=await sb.from('restaurants').insert(items);
 if(error)alert('Error al importar: '+error.message);
 tab='p';await refresh();
};

const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').trim();
const GH={'X-Goog-Api-Key':GOOGLE_KEY};
async function showPhotos(id){
 const i=R.find(x=>x.id===id);
 if(!gEnabled||!i.place_id){if(i.url)window.open(i.url,'_blank','noopener');return}
 $('#ptitle').textContent=i.name;$('#pgrid').innerHTML='<div class="mut">Cargando…</div>';
 $('#pmaps').href=i.url||'#';$('#pdlg').showModal();
 try{
  const r=await fetch('https://places.googleapis.com/v1/places/'+i.place_id,{headers:{...GH,'X-Goog-FieldMask':'photos,googleMapsUri'}});
  const j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.status);
  const ph=(j.photos||[]).slice(0,10);
  $('#pgrid').innerHTML=ph.length?ph.map(p=>'<figure><img loading="lazy" src="https://places.googleapis.com/v1/'+p.name+'/media?maxWidthPx=800&key='+GOOGLE_KEY+'"><figcaption class="mut">'+esc((p.authorAttributions||[])[0]?.displayName||'')+'</figcaption></figure>').join(''):'<div class="mut">Sin fotos</div>';
  if(j.googleMapsUri)$('#pmaps').href=j.googleMapsUri;
 }catch(e){$('#pgrid').innerHTML='<div class="err">'+esc(e.message)+'</div>'}
}
$('#gupd').onclick=async()=>{
 if(!gEnabled)return alert('Falta configurar GOOGLE_KEY en index.html');
 const old=Date.now()-30*864e5;
 const todo=R.filter(i=>!i.place_id||!i.g_updated||new Date(i.g_updated)<old);
 if(!todo.length)return alert('Todo está al día');
 if(!confirm('¿Buscar la nota de Google de '+todo.length+' lugares?'))return;
 const btn=$('#gupd');let ok=0,miss=0;
 for(const [n,i] of todo.entries()){
  btn.textContent='Actualizando '+(n+1)+'/'+todo.length+'…';
  try{
   let pl;
   if(i.place_id){
    const r=await fetch('https://places.googleapis.com/v1/places/'+i.place_id,{headers:{...GH,'X-Goog-FieldMask':'id,rating,userRatingCount'}});
    pl=await r.json();if(!r.ok)throw new Error(pl.error?.message||r.status);
   }else{
    const r=await fetch('https://places.googleapis.com/v1/places:searchText',{method:'POST',
     headers:{...GH,'Content-Type':'application/json','X-Goog-FieldMask':'places.id,places.displayName,places.rating,places.userRatingCount'},
     body:JSON.stringify({textQuery:i.name+' '+(i.zone||'Santiago, Chile'),languageCode:'es',maxResultCount:1,
      locationBias:{circle:{center:{latitude:-33.45,longitude:-70.65},radius:30000}}})});
    const j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.status);
    pl=(j.places||[])[0];
    if(!pl||!norm(pl.displayName?.text).includes(norm(i.name).split(' ')[0])){miss++;continue}
   }
   const {error}=await sb.from('restaurants').update({place_id:pl.id,g:pl.rating??i.g??null,g_count:pl.userRatingCount??null,g_updated:new Date().toISOString()}).eq('id',i.id);
   if(error)throw new Error(error.message);
   ok++;
  }catch(e){alert('Error: '+e.message);break}
  await new Promise(r=>setTimeout(r,120));
 }
 btn.textContent='🔄 Actualizar notas de Google';
 alert(ok+' actualizados, '+miss+' sin coincidencia segura');
 refresh();
};
</script>
</body>
</html>
